services:
  app:
    build:
      args:
        # Prepend the Nix profile to PATH inside the container. The user here must
        # match NIX_USER in lib/nix-seed.sh (the profile it symlinks); compose
        # can't read that bash var, so the path is repeated here and guarded by
        # tests/test-nix-user-sync.sh, which derives it from that default.
        EXTRA_PATH: "/home/vscode/.nix-profile/bin"
    volumes:
      # Durable, project-scoped Nix store, shared across worktrees (the store is
      # content-addressed and cli-locked). Seeded on first run from the tarball
      # baked by install-system.sh.
      - nix:/nix
      # Host nix config (nix.conf, registry.json) read-only. dev/devcontainer
      # always exports DEV_NIX_HOST_CONF — ~/.config/nix, or an empty dir it
      # creates when that's absent, so a missing host config never creates a
      # root-owned dir on the host. Required, not defaulted: the empty-dir
      # fallback exists precisely so the container never sees a device file
      # here, and it's unset only when compose is driven outside
      # dev/devcontainer, where a clear error beats a silent placeholder.
      - ${DEV_NIX_HOST_CONF:?DEV_NIX_HOST_CONF is required (exported by dev/devcontainer)}:/home/vscode/.config/nix-host:ro

volumes:
  # external:true (shared across worktrees) — dev/devcontainer pre-creates it as
  # ${DEV_PROJECT_NAME}-nix via ensure_external_volumes() reading
  # external-volumes.txt. Remove it with `devcontainer clean-caches`.
  nix:
    name: ${DEV_PROJECT_NAME:?DEV_PROJECT_NAME is required}-nix
    external: true
