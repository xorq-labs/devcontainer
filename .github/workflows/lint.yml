name: Lint

# pre-commit is the SINGLE CI lint gate: `pre-commit run --all-files` runs
# shellcheck, ruff, ruff-format, yamllint, and hadolint over the whole tree.
# Standalone per-linter jobs used to duplicate that at a second, hand-kept set
# of versions (and installed shellcheck unpinned from apt, so the two jobs
# could disagree on identical code) — they were deleted.
#
# Consequence: linter versions are pinned in .pre-commit-config.yaml alone,
# plus the container copy in projects/devcontainer/install-system.sh (bare
# binaries on PATH for in-container/editor use). Bump those two together;
# tests/test-lint-config-sync.sh guards the pair.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    name: pre-commit (all linters, end-to-end setup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install pre-commit via repo-local uv tool
        run: |
          export UV_TOOL_DIR="${PWD}/.tools/uvx"
          export UV_TOOL_BIN_DIR="${PWD}/.tools/bin"
          uv tool install pre-commit
          echo "${PWD}/.tools/bin" >> "$GITHUB_PATH"
      - name: Verify tools installed to .tools/
        run: |
          test -x .tools/bin/pre-commit
      - name: Run pre-commit on all files
        run: pre-commit run --all-files
