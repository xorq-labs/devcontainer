name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck on .sh files
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning
      - name: Run ShellCheck on extensionless bash scripts
        # keep in sync with .pre-commit-config.yaml shellcheck (extensionless)
        run: |
          shellcheck --severity=warning \
            dev/devcontainer \
            dev/devcontainer-completions \
            dev/init \
            dev/new-worktree \
            dev/setup-worktree \
            dev/cleanup-worktree \
            dev/hooks/post-checkout

  # ruff/yamllint/hadolint pins below are a three-way sync with
  # .pre-commit-config.yaml and projects/devcontainer/install-system.sh
  # (guarded by tests/test-lint-config-sync.sh); bump all three together.
  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.14"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.14"
          args: "format --check"

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # direct pinned install (hadolint-action bundles its own older hadolint
      # and has no version input); sha256 matches install-system.sh (amd64)
      - name: Install hadolint
        run: |
          curl -fsSL \
            "https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  /usr/local/bin/hadolint" \
            | sha256sum -c -
          chmod +x /usr/local/bin/hadolint
      - run: hadolint --config .hadolint.yaml Dockerfile

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint==1.38.0
      - run: yamllint -c .yamllint.yml .

  pre-commit:
    name: pre-commit (end-to-end setup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install pre-commit via repo-local uv tool
        run: |
          export UV_TOOL_DIR="${PWD}/.tools/uvx"
          export UV_TOOL_BIN_DIR="${PWD}/.tools/bin"
          uv tool install pre-commit
          echo "${PWD}/.tools/bin" >> "$GITHUB_PATH"
      - name: Verify tools installed to .tools/
        run: |
          test -x .tools/bin/pre-commit
      - name: Run pre-commit on all files
        run: pre-commit run --all-files
