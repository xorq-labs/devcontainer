name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-tests:
    name: Bash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two suites create disposable git repos; git needs an identity to commit.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      # tests/run-all is the single entry point for the suite; CI must not
      # re-implement its loop (see the header comment in tests/run-all).
      - name: Run test suites
        run: bash tests/run-all
