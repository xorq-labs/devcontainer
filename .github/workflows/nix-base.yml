name: Nix Base

# Build the Nix hybrid devcontainer base (nix/base/flake.nix) natively per
# arch, smoke-test each image, and publish per-arch images plus a multi-arch
# manifest to ghcr. The base is pushed once and pulled many times: a
# claude-code bump reships only its own layer (plus the ~210 KB infra profile
# layer), so consumers pull one blob, not the image.
#
# Publish rules:
#   - pull_request: build + smoke + drift check only, nothing is pushed.
#   - push to main / workflow_dispatch: per-arch images are pushed as
#     sha-<short>-{amd64,arm64} and assembled into a sha-<short> manifest.
#   - on main only, the manifest is additionally tagged latest and
#     claude-<version> (the dominant change driver). A branch dispatch
#     therefore publishes inspectable sha tags without touching latest.
#
# NOTE: ubuntu-24.04-arm runners are free for PUBLIC repos only. If this repo
# ever goes private, the arm leg needs a paid larger-runner plan (or the
# matrix drops to amd64 and arm64 builds move elsewhere).
#
# If one matrix leg fails after the other already pushed, its
# sha-<short>-<arch> tag is left orphaned on ghcr (the manifest job skips).
# Harmless — consumers only ever pin manifest-list digests — delete stray
# tags by hand if they bother you.
#
# Paths beyond nix/base/** are the tail-build inputs (Dockerfile.nix-default
# COPYs them): a change there must prove the default consumer image still
# builds. A push-triggered republish of an unchanged base is a no-op — the
# build is reproducible, so digests (and the pin) don't move.

on:
  push:
    branches: [main]
    paths:
      - nix/base/**
      # An output of a publish, not an input to one: merging a pin bump must
      # not set off another two-arch republish of byte-identical layers.
      - '!nix/base/compose.nix-base.yml'
      - defaults/**
      - lib/nix-seed.sh
      - lib/git.sh
      - lib/claude-code-token-env.sh
      - setup-claude.py
      - audit-hook
      # Filters the repo-root context the tail build uses, so it can break a
      # COPY without any COPY source changing.
      - .dockerignore
      - .github/workflows/nix-base.yml
      # Not a build input: the post-build check. Listed so an edit to it is
      # exercised by a build rather than first running on someone else's PR.
      - dev/check-image-mount-parents
  pull_request:
    paths:
      - nix/base/**
      # An output of a publish, not an input to one: merging a pin bump must
      # not set off another two-arch republish of byte-identical layers.
      - '!nix/base/compose.nix-base.yml'
      - defaults/**
      - lib/nix-seed.sh
      - lib/git.sh
      - lib/claude-code-token-env.sh
      - setup-claude.py
      - audit-hook
      # Filters the repo-root context the tail build uses, so it can break a
      # COPY without any COPY source changing.
      - .dockerignore
      - .github/workflows/nix-base.yml
      # Not a build input: the post-build check. Listed so an edit to it is
      # exercised by a build rather than first running on someone else's PR.
      - dev/check-image-mount-parents
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devcontainer-nix-base

concurrency:
  group: nix-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build the base image
        run: nix build ./nix/base#defaultBase --print-build-logs

      - name: Load into docker
        run: ./result | docker load

      - name: Smoke test
        run: |
          docker run --rm devcontainer-nix-base:latest claude --version
          docker run --rm devcontainer-nix-base:latest sh -c \
            'gh --version && just --version && sops --version && python3 --version && readlink /bin/sh'

      # Guards the hand-maintained PATH in flake.nix and the fromImage config
      # merge — see the script header. Pulls the pinned MS base once per run.
      - name: Env drift check
        run: nix/base/check-env-drift.sh

      # The path consumers actually build: the project tail over the base,
      # with the defaults overlay (what a non-seed project gets by default).
      - name: Build the project tail on the base
        run: |
          docker build -f nix/base/Dockerfile.nix-default \
            --build-context project=./defaults \
            --build-arg DEV_CONTAINER_WORKSPACE=/workspaces/src \
            -t nix-base-tail:ci .
          docker run --rm nix-base-tail:ci claude --version
          # As vscode, and by RUNNING setup-env rather than `test -x` as root.
          # The old assertion could not fail for #129: no USER is set on the
          # image, so it ran as root, where both -x and -r are true on a 0711
          # file. bash needs the READ bit to execute a script, and only an
          # unprivileged user is subject to it.
          docker run --rm -u vscode nix-base-tail:ci setup-env sync-if-needed

      # Regression for #129. COPY preserves the source's mode, and ./defaults in
      # CI comes from a fresh checkout at 0755 — so the hostile input (a
      # contributor on umask 0077, whose working tree is 0700) is one CI has
      # never built from. The tail layers are the only ones that re-run here;
      # the base is already loaded.
      #
      # Verified (ADR-0005 §2): reverting either Dockerfile's `chmod 755` to
      # `chmod +x` turns this step red with
      # `setup-env: Permission denied` (exit 126), while the step above stays
      # green — which is the asymmetry that let the bug ship.
      - name: Build the tail from a umask-0077 overlay
        run: |
          cp -r ./defaults /tmp/overlay-0700
          chmod 0700 /tmp/overlay-0700/setup-env.sh
          docker build -f nix/base/Dockerfile.nix-default \
            --build-context project=/tmp/overlay-0700 \
            --build-arg DEV_CONTAINER_WORKSPACE=/workspaces/src \
            -t nix-base-tail-0700:ci .
          docker run --rm -u vscode nix-base-tail-0700:ci setup-env sync-if-needed

      # The image half of #106, per arch: the nix route pre-creates
      # ~/.claude/projects in the tail build (the base ships the sibling home
      # dirs but not this one), and only a built image can confirm it landed
      # writable. Same checker as docker-build.yml; it derives the directory
      # and the user from docker-compose.yml.
      - name: Transcript bind parent ships writable
        run: dev/check-image-mount-parents nix-base-tail:ci

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push per-arch image
        if: github.event_name != 'pull_request'
        run: |
          short="${GITHUB_SHA::7}"
          docker tag devcontainer-nix-base:latest "$IMAGE:sha-${short}-${{ matrix.arch }}"
          docker push "$IMAGE:sha-${short}-${{ matrix.arch }}"

  manifest:
    name: Assemble multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest
        run: |
          short="${GITHUB_SHA::7}"
          tags=(-t "$IMAGE:sha-${short}")
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            claude_version="$(grep -m1 -oP '^  version = "\K[^"]*' nix/base/pkgs/claude-code.nix)"
            tags+=(-t "$IMAGE:latest" -t "$IMAGE:claude-${claude_version}")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-${short}-amd64" "$IMAGE:sha-${short}-arm64"

      # The manifest digest printed here is what compose.nix-base.yml pins as
      # BASE_IMAGE. The `pin` job below opens the PR that moves it; this
      # summary stays because it is the human-readable record of the publish.
      - name: Report the published digest
        run: |
          short="${GITHUB_SHA::7}"
          {
            echo "## Nix base published: \`$IMAGE:sha-${short}\`"
            echo '```'
            docker buildx imagetools inspect "$IMAGE:sha-${short}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing alone delivers nothing: consumers build on the BASE_IMAGE digest
  # pinned in nix/base/compose.nix-base.yml, so a base that is published but not
  # pinned reaches no one. That step was owned by nobody and duly went undone —
  # the pin sat on the #41 digest through every later publish (#83).
  #
  # So CI proposes the bump itself, via the same dev/bump-nix-base a human would
  # run. One rewrite path means the manifest-list check and the byte-anchored
  # line format cannot drift between the tool and this workflow.
  #
  # It PROPOSES rather than pushes: the pin stays a deliberate, reviewable act
  # (an upstream retag must never silently change what anyone builds on), and a
  # rebuild prompt lands on every consumer when it merges.
  pin:
    name: Open the pin-bump PR
    if: github.ref == 'refs/heads/main'
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Checkout persists this token as http.extraheader, so it is what the
      # `git push -f` below authenticates as. That matters: a push made with
      # GITHUB_TOKEN does not start workflow runs, so without the PAT here an
      # UPDATE to an existing bump PR would silently carry no checks even when
      # PIN_BUMP_TOKEN is set and the original creation was checked.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIN_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      # Resolve the tag rather than plumbing a digest through job outputs:
      # sha-<short> is immutable per commit, and letting the tool do the lookup
      # keeps resolution — and the manifest-list gate — on the one code path
      # tests/test-bump-nix-base.sh covers. A per-arch digest cannot be written
      # here even if the publish above somehow produced one.
      - name: Bump the pin
        id: bump
        run: |
          short="${GITHUB_SHA::7}"
          dev/bump-nix-base "sha-${short}"
          if git diff --quiet nix/base/compose.nix-base.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pin already current — nothing to propose."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A republish of unchanged content is digest-stable (the build is
      # reproducible), so the common case is changed=false and this job is a
      # no-op. When it does change, force-pushing one long-lived branch means
      # repeated publishes update a single open PR instead of opening one each.
      - name: Open or update the pin-bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          # A PR opened with GITHUB_TOKEN does not trigger workflows, so the
          # bump PR would arrive with no checks at all. Set PIN_BUMP_TOKEN (a
          # PAT with repo scope) to get them; without it the PR is still opened,
          # and the step says plainly that it is unchecked.
          GH_TOKEN: ${{ secrets.PIN_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: auto/nix-base-pin
          # A boolean, not the secret: never interpolate a secret into the
          # script body, where it would be one quoting slip from executing.
          HAS_PAT: ${{ secrets.PIN_BUMP_TOKEN != '' }}
        run: |
          short="${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "chore(nix-base): pin the base published by ${short}"
          git push -f origin "$BRANCH"

          title="chore(nix-base): pin the base published by ${short}"

          # Regenerated on BOTH paths. On an update the branch now pins a
          # different commit's digest, so reusing the original title and body
          # would describe commit A while the diff pins commit B's base.
          {
            echo "Opened automatically after the Nix base publish for \`${GITHUB_SHA}\`."
            echo
            echo "Consumers build on the \`BASE_IMAGE\` digest in"
            echo "\`nix/base/compose.nix-base.yml\`, not on \`latest\`, so the base"
            echo "published by that commit reaches nobody until this merges."
            echo
            echo "Written by \`dev/bump-nix-base\`, which refuses any digest that is"
            echo "not a multi-arch manifest list. Merging prompts a rebuild on every"
            echo "consumer through the staleness hash."
            if [ "$HAS_PAT" != "true" ]; then
              echo
              echo "> Opened with \`GITHUB_TOKEN\`, so **no checks ran on this PR**."
              echo "> That is survivable here — the digest was just built, smoke"
              echo "> tested, tail built and published by the run that opened this"
              echo "> — but set a \`PIN_BUMP_TOKEN\` secret (a PAT with \`repo\`"
              echo "> scope) if you want them. Pushing to this branch by hand also"
              echo "> works, but the next publish force-pushes over it."
            fi
          } > "$RUNNER_TEMP/pin-pr-body.md"

          existing="$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/pin-pr-body.md"
            echo "Updated the open pin-bump PR (#${existing}) onto ${short}."
            exit 0
          fi

          # Opening a PR as GITHUB_TOKEN needs "Allow GitHub Actions to create
          # and approve pull requests", which is settable per-repo only if org
          # policy permits it. Without it this 403s with a message that names
          # neither knob, so translate it — the branch is already pushed, and a
          # human seeing this can either flip the setting or run
          # `dev/bump-nix-base` locally and open the PR themselves.
          if ! gh pr create --base main --head "$BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/pin-pr-body.md"; then
            echo "::error::Could not open the pin-bump PR. The bumped branch" \
              "'$BRANCH' is pushed and ready. If this was a 403, enable" \
              "Settings > Actions > General > 'Allow GitHub Actions to create" \
              "and approve pull requests' (org policy must permit it), or set" \
              "a PIN_BUMP_TOKEN secret, or open the PR from '$BRANCH' by hand."
            exit 1
          fi
