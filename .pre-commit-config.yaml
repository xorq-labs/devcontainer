repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        types: [shell]
        exclude: ^\.envrc$
      # Belt-and-braces for the extensionless dev/ scripts: the hook above
      # already picks them up via identify's shebang detection, which only
      # applies to executable files — this one catches them by path even if
      # the exec bit is lost.
      - id: shellcheck
        name: shellcheck (extensionless)
        args: [--severity=warning]
        types: [file]
        files: >-
          ^dev/(devcontainer|devcontainer-completions|init|new-worktree|setup-worktree|cleanup-worktree|check-gitignore-agents|check-image-mount-parents|hooks/post-checkout)$

  # These pins are the source of truth for CI (the pre-commit job is the only
  # CI lint gate). Keep ruff/yamllint/hadolint in sync with the in-container
  # copies in projects/devcontainer/install-system.sh — the only other place
  # they are pinned. Guarded by tests/test-lint-config-sync.sh.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  # types: [dockerfile] matches BOTH `Dockerfile` and
  # `nix/base/Dockerfile.nix-default` (identify tags the `.Dockerfile`-style
  # suffix too) — no `files:` pattern needed.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint
        args: [--config, .hadolint.yaml]

  # The live .gitignore is untracked and per-checkout, so no hermetic test
  # can see it drift from .gitignore.template's ADR-0003 stanza; this
  # functional probe at commit time is the guard (#91). CI's fresh checkout
  # has no live file and passes vacuously — the target is dev machines.
  - repo: local
    hooks:
      - id: gitignore-agents-reinclusion
        name: gitignore re-includes .claude/agents/ (ADR-0003)
        entry: dev/check-gitignore-agents
        language: script
        always_run: true
        pass_filenames: false
